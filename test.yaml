- name: Clean & Deploy
  env:
    CLOUDSMITH_USER: ${{ vars.CLOUDSMITH_USER }}
    CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
  run: |
    mvn clean deploy -B \
      -DskipTests \
      -DaltDeploymentRepository=cloudsmith-repo::default::https://${{ env.CLOUDSMITH_USER }}:${{ env.CLOUDSMITH_API_KEY }}@maven.cloudsmith.io/workspace-for-rajdeep/maven-test/

- name: Wait for Package Synchronization
  id: wait-for-package-sync
  continue-on-error: true
  env:
    ORGANIZATION: thrivent
    REPOSITORY: maven-non-prod
    PACKAGE_NAME: ${{ inputs.artifact-name }}
    PACKAGE_VERSION: ${{ inputs.version }}
    TIMEOUT: 120
  shell: bash
  run: |
    set +e
    set +o pipefail

    get_package_identifier() {
        local package_name=${1:-""}
        local package_version=${2:-""}
        local query=""

        if [[ "$package_version" == *"SNAPSHOT"* ]]; then
            local version_without_snapshot=$(echo "$package_version" | sed 's/SNAPSHOT//g')
            query="name:$package_name version:$version_without_snapshot*"
            echo "Using snapshot query pattern: $query" > /dev/stderr
            cloudsmith list packages --output-format json --query "$query" "$ORGANIZATION/$REPOSITORY" 2> /dev/null | \
              jq -r --arg version "$version_without_snapshot" '
                  .data
                  | map(select(.version | startswith($version)))
                  | sort_by(.version) | reverse
                  | first | .slug_perm'
        else
            query="name:$package_name version:$package_version"
            echo "Using release query pattern: $query" > /dev/stderr
            cloudsmith list packages --output-format json --query "$query" "$ORGANIZATION/$REPOSITORY" 2> /dev/null | jq -r '.data[0].slug_perm' | sed -e 's/^"//' -e 's/"$//'
        fi
    }

    get_package_status() {
        local identifier=${1:-""}
        cloudsmith status "$ORGANIZATION/$REPOSITORY/$identifier" 2> /dev/null
    }

    wait_for_package_sync() {
        local package_name=${1:-""}
        local package_version=${2:-""}
        local total_time_limit="$TIMEOUT"
        local identifier=""
        local package_status=""
        local total_time=0
        local package_sync_complete=1
        local package_sync_failed=0
        local sleep_time=10

        while [[ $total_time -lt $total_time_limit ]]; do
            if [[ -z "$identifier" ]] || [[ "$identifier" == "null" ]]; then
                identifier=$(get_package_identifier "$package_name" "$package_version")
                if [[ -z "$identifier" ]] || [[ "$identifier" == "null" ]]; then
                  echo "Waiting for package .. (name:$package_name version:$package_version)"
                  total_time=$((total_time+$sleep_time))
                  sleep $sleep_time
                  continue
                fi
            fi

            package_status=$(get_package_status "$identifier")

            echo "$package_status" | grep --quiet 'Completed'
            package_sync_
